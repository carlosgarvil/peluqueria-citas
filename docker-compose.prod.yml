# Imagen de PRODUCCIÓN (sin volúmenes de código):
#   docker compose -f docker-compose.prod.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peluqueria
      POSTGRES_PASSWORD: peluqueria
      POSTGRES_DB: peluqueria
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peluqueria -d peluqueria"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://peluqueria:peluqueria@db:5432/peluqueria?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env}
      BUSINESS_TZ: ${BUSINESS_TZ:-Europe/Madrid}
    ports:
      - "3000:3000"

volumes:
  pgdata_prod:
